[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shorts-maker-gpu"
version = "0.1.4"
description = "GPU-accelerated short video generator using NVIDIA VPF and PyTorch."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Artem Ryazanov" }]
dependencies = [
    "numpy>=2.0.0",
    "opencv-python>=4.10.0.84",
    "python-dotenv>=1.2.1",
    "tqdm>=4.66.0",
    "typer>=0.12.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
]

[project.scripts]
shorts-maker = "shorts_maker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/shorts_maker"]

[tool.mypy]
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
